name: HIBRAH Classic Menswear Image Pilot

on:
  push:
    branches:
      - drafts
    paths:
      - ".github/workflows/classic-menswear-image-pilot.yml"
      - "scripts/download_classic_menswear_pilot.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout drafts branch
        uses: actions/checkout@v4
        with:
          ref: drafts
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect specialist menswear reference images
        run: python scripts/download_classic_menswear_pilot.py
      - name: Commit pilot images and review manifest
        if: always()
        run: |
          if [ -d research-assets/classic-menswear-library/00_incoming_pilot ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-assets/classic-menswear-library/00_incoming_pilot
            if git diff --cached --quiet; then
              echo "No new pilot output to commit."
            else
              git commit -m "Add specialist classic menswear image pilot"
              git push origin drafts
            fi
          fi
