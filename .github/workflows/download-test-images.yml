name: Download 10 HIBRAH test images

on:
  push:
    paths:
      - ".github/workflows/download-test-images.yml"
      - "scripts/download_test_images.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependency
        run: python -m pip install --disable-pip-version-check requests

      - name: Download 10 licensed images from multiple sources
        run: python scripts/download_test_images.py

      - name: Save downloaded images and source records
        if: always()
        run: |
          if [ -d research-assets/test-10-images ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add research-assets/test-10-images
            if git diff --cached --quiet; then
              echo "No downloaded files to commit."
            else
              git commit -m "Save multi-source 10-image download test results"
              git push
            fi
          else
            echo "No output directory was created."
          fi
