name: HIBRAH Fabric Reference — 100 Images

on:
  workflow_dispatch:

concurrency:
  group: hibrah-fabric-100-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect and validate 100 fabric images
        run: python scripts/collect_hibrah_fabric_100.py
      - name: Commit images, manifest and contact sheets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-assets/classic-menswear-library/01_fabric_visual_review_100
          git commit -m "Add 100 curated fabric reference images"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Batch committed to main."
              exit 0
            fi
            echo "Push race detected; retrying ($attempt/5)."
          done
          echo "Unable to push after five retries."
          exit 1
      - name: Upload review contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: hibrah-fabric-100-contact-sheets
          path: research-assets/classic-menswear-library/01_fabric_visual_review_100/contact_sheet_*.jpg
          retention-days: 14
