name: HIBRAH Fabric Reference — 100 Images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hibrah-fabric-100.yml"
      - "scripts/collect_hibrah_fabric_100.py"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 pillow
      - name: Collect and validate 100 fabric images
        run: python scripts/collect_hibrah_fabric_100.py
      - name: Commit images, manifest and contact sheets to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-assets/classic-menswear-library/01_fabric_visual_review_100
          git commit -m "Add 100 curated fabric reference images"
          git push origin main
      - name: Upload review contact sheets
        uses: actions/upload-artifact@v4
        with:
          name: hibrah-fabric-100-contact-sheets
          path: research-assets/classic-menswear-library/01_fabric_visual_review_100/contact_sheet_*.jpg
          retention-days: 14
